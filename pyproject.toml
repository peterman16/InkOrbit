[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inkorbit"
dynamic = ["version"]
description = "Orbital diagrams in the style of 1960s black-and-white technical print."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
authors = [{ name = "Peter" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: Matplotlib",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "Hershey-Fonts>=2.1",
]

[project.urls]
Repository = "https://github.com/peterman16/PrettyAstrodynamics"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-mpl>=0.17",
    "ruff>=0.6",
]

[tool.hatch.version]
path = "src/inkorbit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/inkorbit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--mpl --mpl-baseline-path=tests/baseline"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]
