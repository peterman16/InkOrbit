name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run --locked --only-group dev ruff check .
      - run: uv run --locked --only-group dev ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run --locked pytest --mpl-results-path=result_images
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: result-images-${{ matrix.python-version }}
          path: result_images

  adapters:
    # poliastro needs Python < 3.11 and hapsira needs matplotlib < 3.8, so the
    # real-library adapter tests run in their own environment, outside the lock.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.10"
      - run: uv venv .venv-adapters
      - run: uv pip install --python .venv-adapters --require-hashes -r ci/adapters-constraints.txt
      - run: uv pip install --python .venv-adapters --no-deps -e .
      - run: .venv-adapters/bin/python -c "import hapsira, poliastro, skyfield, astropy"
      - run: .venv-adapters/bin/python -m pytest tests/test_adapters.py tests/test_diagrams.py
